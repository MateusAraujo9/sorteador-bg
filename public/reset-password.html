<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Sorteador de Boardgames</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header class="brand-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="30" height="30">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#f4ecd8" stroke-width="1.6"/>
          <circle cx="8" cy="8" r="1.4" fill="#f4ecd8"/>
          <circle cx="16" cy="8" r="1.4" fill="#f4ecd8"/>
          <circle cx="12" cy="12" r="1.4" fill="#f4ecd8"/>
          <circle cx="8" cy="16" r="1.4" fill="#f4ecd8"/>
          <circle cx="16" cy="16" r="1.4" fill="#f4ecd8"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Sorteador de <em>Boardgames</em></h1>
        <p>Escolha uma nova senha para sua conta.</p>
      </div>
    </header>

    <section class="auth-view">
      <div class="panel auth-panel">
        <form id="resetForm" class="auth-form is-active">
          <div class="field">
            <label for="newPassword">Nova senha</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo de 6 caracteres" minlength="6" required>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirmar nova senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita a nova senha" required>
          </div>
          <button type="submit" class="btn btn-primary">Redefinir senha</button>
        </form>

        <div id="invalidState" class="empty-state" hidden>
          <p class="empty-state__title">Link inválido ou expirado.</p>
          <p class="empty-state__message">Peça um novo link de redefinição na tela de login.</p>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
